name: Deploy minisites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wire Galilion extras
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('galilion-2026/index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./trip-extras.js"></script>'
          if tag not in text:
              text = text.replace('</body>', tag + '</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Persist Galilion wiring
        shell: bash
        run: |
          if git diff --quiet -- galilion-2026/index.html; then
            echo "Dashboard already wired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add galilion-2026/index.html
            git commit -m "Load Galilion lunch and packing module"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
