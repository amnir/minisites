name: Deploy minisites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add graphical road-stop timeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('galilion-2026/index.html')
          text = p.read_text(encoding='utf-8')

          css = '''.roadnote{font-size:11px;color:var(--mut);margin:2px 0 10px}.journey{margin-top:10px;border:1px solid var(--ln);background:#fbfaf6;border-radius:14px;padding:10px}.journey .jlbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--mut)}.rail{position:relative;height:30px}.line{position:absolute;top:14px;left:8px;right:8px;height:4px;background:#e9e4d8;border-radius:999px}.dot{position:absolute;top:8px;width:16px;height:16px;border-radius:50%;background:var(--ac);border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,.12);transform:translateX(50%)}.startdot,.enddot{position:absolute;top:11px;width:10px;height:10px;border-radius:50%;background:#b9bebc}.startdot{right:8px}.enddot{left:8px}.timetag{position:absolute;top:-3px;transform:translateX(50%);background:white;border:1px solid var(--ln);border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;white-space:nowrap}.jtiny{font-size:10px;color:var(--mut);margin-top:2px}.legend{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.legend .chip{background:#f5f2ea}'''
          if '.roadnote{' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          road = '''<div class="sec" id="road"><h2>עצירות התרעננות בדרך 🚗</h2><span>הלוך מחולון · חזור לרמת גן</span></div><p class="roadnote">הפס מראה <b>איפה לאורך הנסיעה</b> נמצאת כל עצירה. הזמנים משוערים לנסיעה זורמת — Waze ביום עצמו קובע.</p><div class="legend"><span class="chip">◉ יציאה</span><span class="chip">● עצירה</span><span class="chip">◎ יעד</span></div><div class="bank">
          <div class="place"><div class="placehead"><h3>🛝 חוצות אלונים</h3><span>עצירה משפחתית מומלצת</span></div><p>מתאים לעצירה של 20–45 דק׳: שירותים, פינת החתלה, מתקני משחק, אוכל וקפה וחניה גדולה.</p><div class="journey"><div class="jlbl"><span>חולון</span><span>גליליון</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:45%">אחרי ~1:10–1:25 ש׳</div><div class="dot" style="right:45%"></div></div><div class="jtiny">הלוך: עצירה טובה בערך אחרי השעה הראשונה.</div></div><div class="journey"><div class="jlbl"><span>גליליון</span><span>רמת גן</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:60%">אחרי ~1:30–1:45 ש׳</div><div class="dot" style="right:60%"></div></div><div class="jtiny">חזור: עצירה מאוחרת יחסית; אחריה נשאר בערך עוד שעה.</div></div><div class="chips"><span class="chip">↗ הלוך</span><span class="chip">↙ חזור</span><span class="chip">👶 טוב במיוחד עם ילדים</span></div><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="https://malls.amot.co.il/mall-huzot_alonim/stores/">🔗 אתר רשמי</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=%D7%97%D7%95%D7%A6%D7%95%D7%AA%20%D7%90%D7%9C%D7%95%D7%A0%D7%99%D7%9D">📍 מפה</a></div></div>
          <div class="place"><div class="placehead"><h3>🪵 סטריט מול רמת ישי + נוגילולה</h3><span>כשצריך ממש לפרוק אנרגיה</span></div><p>עצירה ארוכה יותר של 45–90 דק׳: אוכל וקפה, ובקומה העליונה משחקיית העץ נוגילולה.</p><div class="journey"><div class="jlbl"><span>חולון</span><span>גליליון</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:52%">אחרי ~1:20–1:35 ש׳</div><div class="dot" style="right:52%"></div></div><div class="jtiny">הלוך: בערך אמצע הדרך — בחירה טובה להפסקה רצינית.</div></div><div class="journey"><div class="jlbl"><span>גליליון</span><span>רמת גן</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:52%">אחרי ~1:20–1:35 ש׳</div><div class="dot" style="right:52%"></div></div><div class="jtiny">חזור: עצירת אמצע קלאסית.</div></div><div class="chips"><span class="chip">↗ הלוך</span><span class="chip">↙ חזור</span><span class="chip">❄️ אופציה ממוזגת</span></div><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="https://street-mall.arielgroup.co.il/">🔗 סטריט מול</a><a class="btn" target="_blank" rel="noopener" href="https://www.nogilula.co.il/contact">🛝 נוגילולה</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Street%20Mall%20Ramat%20Yishai">📍 מפה</a></div></div>
          <div class="place"><div class="placehead"><h3>☕ סנטר הגליל, ראש פינה</h3><span>עצירה מאוחרת / מוקדמת בחזור</span></div><p>שירותים, פינת החתלה, בתי קפה/מסעדות וחניה — קרוב יחסית לגליליון.</p><div class="journey"><div class="jlbl"><span>חולון</span><span>גליליון</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:86%">אחרי ~2:15–2:30 ש׳</div><div class="dot" style="right:86%"></div></div><div class="jtiny">הלוך: עצירה אחרונה לפני המלון.</div></div><div class="journey"><div class="jlbl"><span>גליליון</span><span>רמת גן</span></div><div class="rail"><div class="line"></div><div class="startdot"></div><div class="enddot"></div><div class="timetag" style="right:12%">אחרי ~20–30 דק׳</div><div class="dot" style="right:12%"></div></div><div class="jtiny">חזור: עצירה ממש בתחילת הדרך.</div></div><div class="chips"><span class="chip">↗ לפני המלון</span><span class="chip">↙ בתחילת החזור</span><span class="chip">🍼 פינת החתלה</span></div><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="https://malls.amot.co.il/mall-center-galil/">🔗 אתר רשמי</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Center%20Galilee%20Rosh%20Pina">📍 מפה</a></div></div>
          </div><p style="font-size:10px;line-height:1.5;margin:9px 3px 0">הזמנים הם סדר גודל בלבד. המסלול והפקקים בפועל יכולים לשנות אותם משמעותית.</p>'''

          text, n = re.subn(r'<div class="sec" id="road">.*?(?=<div class="sec" id="bank">)', road, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'road section replacement count was {n}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
